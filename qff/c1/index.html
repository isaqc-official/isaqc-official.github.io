<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Function Finder - Challenge 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            background: linear-gradient(135deg, #0a0a23 0%, #1a1a3e 100%);
            color: #e0e0e0;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(45deg, #00d4ff, #ff0080);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .header p {
            color: #a0a0a0;
            font-size: 1.1rem;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }

        .panel h2 {
            color: #00d4ff;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #c0c0c0;
            font-size: 0.9rem;
        }

        .state-input {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .state-input span {
            width: 40px;
            color: #00d4ff;
            font-weight: bold;
        }

        .state-input input {
            flex: 1;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            color: #e0e0e0;
            font-family: inherit;
        }

        .state-input input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        .button {
            background: linear-gradient(45deg, #00d4ff, #0080ff);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            width: 100%;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .result-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .result-item .state {
            color: #00d4ff;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .result-item .prob {
            color: #e0e0e0;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        .presets {
            margin-bottom: 20px;
        }

        .preset-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .preset-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #c0c0c0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .preset-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #00d4ff;
        }

        .error {
            color: #ff4444;
            background: rgba(255, 68, 68, 0.1);
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            border: 1px solid rgba(255, 68, 68, 0.3);
        }

        .loading {
            text-align: center;
            color: #00d4ff;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Quantum Function Finder</h1>
            <p>Challenge 1 - Quantum Circuit Simulator</p>
        </div>

        <div class="main-content">
            <div class="panel">
                <h2>Input State Probabilities</h2>
                
                <div class="presets">
                    <label>Quick Presets:</label>
                    <div class="preset-buttons">
                        <button class="preset-btn" onclick="loadPreset('pure000')">Pure |000⟩</button>
                        <button class="preset-btn" onclick="loadPreset('superposition')">Superposition</button>
                        <button class="preset-btn" onclick="loadPreset('weighted')">Weighted</button>
                        <button class="preset-btn" onclick="loadPreset('uniform')">Uniform</button>
                    </div>
                </div>

                <div id="input-states">
                    <!-- State inputs will be generated by JavaScript -->
                </div>

                <button class="button" onclick="runQuantumCircuit()" id="runBtn">
                    Run Quantum Circuit
                </button>

                <div id="error-message"></div>
            </div>

            <div class="panel">
                <h2>Output State Probabilities</h2>
                <div id="loading" class="loading" style="display: none;">
                    Processing quantum circuit...
                </div>
                <div id="results">
                    <p style="color: #a0a0a0; text-align: center;">Run the circuit to see results</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Generate input fields for all 8 quantum states
        function generateInputFields() {
            const container = document.getElementById('input-states');
            const states = ['000', '001', '010', '011', '100', '101', '110', '111'];
            
            states.forEach(state => {
                const div = document.createElement('div');
                div.className = 'state-input';
                div.innerHTML = `
                    <span>|${state}⟩</span>
                    <input type="number" id="state_${state}" min="0" max="1" step="0.01" value="0" 
                           placeholder="0.0" onchange="validateProbabilities()">
                `;
                container.appendChild(div);
            });
        }

        // Validate that probabilities sum to 1
        function validateProbabilities() {
            const states = ['000', '001', '010', '011', '100', '101', '110', '111'];
            let sum = 0;
            
            states.forEach(state => {
                const value = parseFloat(document.getElementById(`state_${state}`).value) || 0;
                sum += value;
            });
            
            const errorDiv = document.getElementById('error-message');
            if (Math.abs(sum - 1.0) > 0.001) {
                errorDiv.innerHTML = `<div class="error">Probabilities sum to ${sum.toFixed(3)}, must sum to 1.0</div>`;
                document.getElementById('runBtn').disabled = true;
            } else {
                errorDiv.innerHTML = '';
                document.getElementById('runBtn').disabled = false;
            }
        }

        // Load preset configurations
        function loadPreset(preset) {
            const states = ['000', '001', '010', '011', '100', '101', '110', '111'];
            
            // Clear all inputs first
            states.forEach(state => {
                document.getElementById(`state_${state}`).value = 0;
            });
            
            switch(preset) {
                case 'pure000':
                    document.getElementById('state_000').value = 1.0;
                    break;
                case 'superposition':
                    document.getElementById('state_000').value = 0.5;
                    document.getElementById('state_111').value = 0.5;
                    break;
                case 'weighted':
                    document.getElementById('state_001').value = 0.7;
                    document.getElementById('state_110').value = 0.3;
                    break;
                case 'uniform':
                    states.forEach(state => {
                        document.getElementById(`state_${state}`).value = 0.125;
                    });
                    break;
            }
            
            validateProbabilities();
        }

        // Run the quantum circuit
        async function runQuantumCircuit() {
            const states = ['000', '001', '010', '011', '100', '101', '110', '111'];
            const inputProbs = {};
            
            // Collect input probabilities
            states.forEach(state => {
                const value = parseFloat(document.getElementById(`state_${state}`).value) || 0;
                if (value > 0) {
                    inputProbs[state] = value;
                }
            });
            
            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').innerHTML = '';
            document.getElementById('runBtn').disabled = true;
            
            try {
                const response = await fetch('https://game.centralindia.cloudapp.azure.com/api/quantum', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ input_probs: inputProbs })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    displayResults(data.output_probs);
                } else {
                    throw new Error(data.error || 'Unknown error');
                }
            } catch (error) {
                document.getElementById('results').innerHTML = 
                    `<div class="error">Error: ${error.message}</div>`;
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('runBtn').disabled = false;
            }
        }

        // Display results
        function displayResults(outputProbs) {
            const resultsDiv = document.getElementById('results');
            const states = ['000', '001', '010', '011', '100', '101', '110', '111'];
            
            let html = '<div class="result-grid">';
            states.forEach(state => {
                const prob = outputProbs[state] || 0;
                const percentage = (prob * 100).toFixed(2);
                html += `
                    <div class="result-item">
                        <div class="state">|${state}⟩</div>
                        <div class="prob">${percentage}%</div>
                    </div>
                `;
            });
            html += '</div>';
            
            resultsDiv.innerHTML = html;
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            generateInputFields();
            loadPreset('pure000'); // Load default preset
        });
    </script>
</body>
</html>
